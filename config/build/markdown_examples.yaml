# 10 and 11 sequential DynestyStatic/Drawer fits respectively. Measured 2026-08-20
# on 1 core: ~32s per fit, flat in major_axis (0.3" and 3.6" both 32s), so the
# worst cell is ~6 min and the whole page ~13 min. An earlier attempt was
# abandoned on a 7200s CellTimeoutError and recorded as "genuinely multi-hour" —
# that diagnosis does not reproduce; 120 is ~20x headroom over the measured cell.
- script: scripts/ellipse/modeling.py
  max_minutes: 120
